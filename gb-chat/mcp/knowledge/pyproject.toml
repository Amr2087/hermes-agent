[project]
name = "gb-knowledge-mcp"
version = "0.1.0"
description = "GB Chat MCP server: search Corp-ChatWithData knowledge bases as tools"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "httpx>=0.27",
  "pyjwt>=2.8",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["gb_knowledge"]
