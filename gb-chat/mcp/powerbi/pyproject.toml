[project]
name = "gb-powerbi-mcp"
version = "0.1.0"
description = "GB Chat MCP server: query Corp-ChatWithData Power BI datasets with DAX as tools"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "httpx>=0.27",
  "pyjwt>=2.8",
  "cryptography>=42",
  "msal>=1.28",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["gb_powerbi"]
